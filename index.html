<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>房間佈置模擬器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="view" aria-label="3D 房間"></canvas>
<div id="labels" aria-hidden="true"></div>
<div id="selLabel" hidden></div>

<header id="top">
  <div class="brand">房間佈置</div>
  <nav id="views" role="tablist" aria-label="視角">
    <button data-view="orbit" class="on">全景</button>
    <button data-view="top">俯視</button>
    <button data-view="inside">室內</button>
    <button data-view="door">門口</button>
    <button data-view="bed">床上</button>
  </nav>
  <div class="modes">
    <button id="btnNight" title="切換白天／晚上">☀️ 白天</button>
    <button id="btnCeil" title="頂燈開關">💡 頂燈</button>
  </div>
</header>

<div id="tools">
  <button id="btnAdd" class="primary">＋家具</button>
  <button id="btnUndo" title="復原" aria-label="復原">↶</button>
  <button id="btnRedo" title="重做" aria-label="重做">↷</button>
  <button id="btnSize" title="尺寸設定">📐 尺寸</button>
  <button id="btnMenu" title="提案與配置">☰ 更多</button>
</div>

<aside id="panel" hidden></aside>
<div id="hint"></div>
<div id="toast" role="status" hidden></div>

<section id="sheetCatalog" class="sheet" hidden>
  <div class="sheet-head"><h2>＋家具</h2><button class="close" data-close>✕</button></div>
  <div id="catTabs" class="tabs"></div>
  <div id="catGrid" class="grid"></div>
</section>

<section id="sheetSize" class="sheet" hidden>
  <div class="sheet-head"><h2>尺寸設定（公分）</h2><button class="close" data-close>✕</button></div>
  <p class="note">部分尺寸依照片估算，可在這裡校正。修改後 3D 模型與碰撞範圍會立即更新，被牆或柱子壓到的家具會自動移到最近的空位。</p>
  <div id="sizeFields"></div>
</section>

<section id="sheetMenu" class="sheet" hidden>
  <div class="sheet-head"><h2>提案與配置</h2><button class="close" data-close>✕</button></div>
  <h3>佈置提案</h3>
  <div id="proposals"></div>
  <h3>房門</h3>
  <label class="row">門扇開啟角度 <input id="doorAngle" type="range" min="0" max="90" step="1"><output id="doorAngleOut"></output></label>
  <label class="row check"><input id="showSwing" type="checkbox"> 在地面顯示 76 cm 開門範圍</label>
  <h3>配置檔</h3>
  <div class="btnrow">
    <button id="btnExport">匯出配置 JSON</button>
    <button id="btnImport">匯入配置 JSON</button>
    <button id="btnReset" class="danger">重設房間</button>
  </div>
  <input id="fileInput" type="file" accept="application/json,.json" hidden>
  <p class="note">配置會自動儲存在這個瀏覽器。操作：拖曳空白處旋轉鏡頭、滾輪或雙指縮放、點選家具後拖曳移動。鍵盤：方向鍵移動 1 cm（Shift 5 cm）、R 旋轉、Delete 刪除、Ctrl+Z／Y 復原重做。</p>
</section>

<div id="fatal" hidden></div>
<script type="module" src="js/app.js"></script>
<noscript>需要啟用 JavaScript 才能使用房間佈置模擬器。</noscript>
</body>
</html>
